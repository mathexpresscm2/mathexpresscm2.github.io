<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" height="100%">
    <defs>
        <filter id="shadow-k8" x="-5%" y="-5%" width="115%" height="115%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15" />
        </filter>
    </defs>

    <!-- Background -->
    <rect width="520" height="320" fill="#ffffff" rx="12" />

    <!-- Hình bình hành ABCD fill nhẹ -->
    <polygon points="120,70 440,70 380,250 60,250" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Tứ giác PMQN fill ngọc lục bảo nổi bật -->
    <polygon points="170,160 280,70 330,160 220,250" fill="#10b981" fill-opacity="0.18" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" filter="url(#shadow-k8)" />

    <!-- Các đoạn nối giao điểm -->
    <!-- AN -->
    <line x1="120" y1="70" x2="220" y2="250" stroke="#f97316" stroke-width="1.8" />
    <!-- DM -->
    <line x1="60" y1="250" x2="280" y2="70" stroke="#f97316" stroke-width="1.8" />
    <!-- BN -->
    <line x1="440" y1="70" x2="220" y2="250" stroke="#0284c7" stroke-width="1.8" />
    <!-- CM -->
    <line x1="380" y1="250" x2="280" y2="70" stroke="#0284c7" stroke-width="1.8" />

    <!-- Ký hiệu bằng nhau trên AB và CD -->
    <!-- AM = MB: 1 gạch -->
    <line x1="198" y1="64" x2="202" y2="76" stroke="#1e3a8a" stroke-width="1.6" />
    <line x1="358" y1="64" x2="362" y2="76" stroke="#1e3a8a" stroke-width="1.6" />

    <!-- DN = NC: 1 gạch -->
    <line x1="138" y1="244" x2="142" y2="256" stroke="#1e3a8a" stroke-width="1.6" />
    <line x1="298" y1="244" x2="302" y2="256" stroke="#1e3a8a" stroke-width="1.6" />

    <!-- Các điểm tròn (Points) -->
    <circle cx="120" cy="70" r="4" fill="#1e3a8a" />
    <circle cx="440" cy="70" r="4" fill="#1e3a8a" />
    <circle cx="380" cy="250" r="4" fill="#1e3a8a" />
    <circle cx="60" cy="250" r="4" fill="#1e3a8a" />
    <circle cx="280" cy="70" r="4.5" fill="#f97316" />
    <circle cx="220" cy="250" r="4.5" fill="#f97316" />
    <circle cx="170" cy="160" r="4.5" fill="#059669" />
    <circle cx="330" cy="160" r="4.5" fill="#059669" />

    <!-- Nhãn các điểm (Text) -->
    <text x="105" y="60" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">A</text>
    <text x="445" y="65" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">B</text>
    <text x="390" y="265" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">C</text>
    <text x="40" y="265" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">D</text>
    <text x="275" y="55" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#f97316">M</text>
    <text x="215" y="275" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#f97316">N</text>
    <text x="145" y="165" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#059669">P</text>
    <text x="340" y="165" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#059669">Q</text>
</svg>
