  <!-- Nhận xét chi tiết -->
  <text x="1120" y="43" class="cmt-text font-serif">
    <tspan x="1120" dy="0">- Con vận dụng được kiến thức cơ bản để thực hiện</tspan>
    <tspan x="1120" dy="17.6">dạng bài cơ bản viết đa thức theo yêu cầu của đề</tspan>
    <tspan x="1120" dy="17.6">bài.</tspan>
    <tspan x="1120" dy="17.6">- Con áp dụng được kiến thức để thực hiện dạng</tspan>
    <tspan x="1120" dy="17.6">bài về tỉ lệ thức, tính chất dãy tỉ số bằng nhau.</tspan>
    <tspan x="1120" dy="17.6">- Con vận dụng được kiến thức để chứng minh hai</tspan>
    <tspan x="1120" dy="17.6">tam giác bằng nhau, chứng minh hai đường thẳng</tspan>
    <tspan x="1120" dy="17.6">song song.</tspan>
    <tspan x="1120" dy="17.6">- Con chưa vận dụng được kiến thức để thực hiện</tspan>
    <tspan x="1120" dy="17.6">các bài cơ bản về cộng, trừ và tìm nghiệm của đa</tspan>
    <tspan x="1120" dy="17.6">thức.</tspan>
    <tspan x="1120" dy="17.6">- Con chưa vận dụng được kiến thức để thực hiện</tspan>
    <tspan x="1120" dy="17.6">bài mở rộng về: tính chất trọng tâm của tam giác</tspan>
    <tspan x="1120" dy="17.6">để chứng minh ba đường thẳng đồng quy.</tspan>
    <tspan x="1120" dy="17.6">- Con cần cẩn thận hơn trong quá trình tính toán.</tspan>
  </text>

