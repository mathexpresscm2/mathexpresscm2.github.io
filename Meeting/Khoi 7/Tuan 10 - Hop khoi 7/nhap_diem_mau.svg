      .cell-text-l { font-size: 12.5px; fill: #000000; text-anchor: start; dominant-baseline: central; }
      .cell-text-bold { font-size: 13.5px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .cmt-text { font-size: 12px; fill: #000000; text-anchor: start; dominant-baseline: auto; }
      .grid-line { stroke: #000000; stroke-width: 1; shape-rendering: crispEdges; }
      .grid-gray { stroke: #bfbfbf; stroke-width: 1; shape-rendering: crispEdges; }
      .thick-line { stroke: #000000; stroke-width: 2.2; shape-rendering: crispEdges; }
