      .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; }
      .hdr-text { font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .row-num { font-size: 11px; fill: #595959; text-anchor: middle; dominant-baseline: central; font-family: Arial, sans-serif; }
