  <text x="324.0" y="13.5" class="hdr-text font-serif">Họ tên học sinh</text>
  <text x="442.0" y="13.5" class="hdr-text font-serif">Ngày sinh</text>
  <text x="562.0" y="13.5" class="hdr-text font-serif">Họ tên phụ huynh</text>
  <text x="682.0" y="13.5" class="hdr-text font-serif">SĐT</text>
