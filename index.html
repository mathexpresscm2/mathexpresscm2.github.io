<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathExpress · Thư viện bài trình chiếu</title>
  <meta name="description" content="Thư viện bài trình chiếu họp chuyên môn MathExpress cho Giáo viên &amp; Trợ giảng.">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { if (localStorage.getItem('mx_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) { }
  </script>
</head>

<body>
  <header class="wrap head">
    <img src="logo.svg" alt="MathExpress" class="logo">
    <h1>Thư viện bài trình chiếu</h1>
    <button type="button" class="theme" id="theme" aria-label="Đổi giao diện sáng / tối" title="Đổi giao diện sáng / tối">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="wrap">
    <nav class="filters" id="filters" aria-label="Lọc theo khối"></nav>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
  </main>

  <footer class="wrap foot">
    <p class="quote">Stick around. I'm full of bad ideas.</p>
  </footer>

  <script src="data/fallback_data.js"></script>
  <script src="app.js"></script>
</body>

</html>
